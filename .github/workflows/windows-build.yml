name: Build N-Lite for Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select application version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = '0.2.0'
          }
          "NLITE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure x64 release
        run: cmake -S . -B build -A x64 "-DNLITE_VERSION=$env:NLITE_VERSION"

      - name: Build portable executable
        run: cmake --build build --config Release --parallel

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath build/Release/N-Lite.exe -Destination dist/N-Lite.exe

      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: N-Lite-Windows-x64
          path: dist/N-Lite.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: dist/N-Lite.exe
