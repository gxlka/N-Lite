name: Build N-Lite for Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select application version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = '0.2.2'
          }
          "NLITE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure x64 release
        run: cmake -S . -B build -A x64 "-DNLITE_VERSION=$env:NLITE_VERSION"

      - name: Build portable executable
        run: cmake --build build --config Release --parallel

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath build/Release/N-Lite.exe -Destination dist/N-Lite.exe

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe')
          )
          $compiler = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            $installed = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($installed) { $compiler = $installed.Source }
          }
          if (-not $compiler) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          & $compiler "/DMyAppVersion=$env:NLITE_VERSION" installer/N-Lite.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with code $LASTEXITCODE" }

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N-Lite-Windows-x64
          path: |
            dist/N-Lite.exe
            dist/N-Lite-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish complete notes for the first release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-notes:v0.2.1]')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v0.2.1" -Headers $headers
          $body = Get-Content -LiteralPath "releases/v0.2.1.md" -Raw
          $payload = @{ body = $body } | ConvertTo-Json -Depth 3
          Invoke-RestMethod -Method Patch -Uri $release.url -Headers $headers -ContentType "application/json" -Body $payload | Out-Null

      - name: Publish v0.2.2 release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release:0.2.2]')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.2.2
          target_commitish: ${{ github.sha }}
          body_path: releases/v0.2.2.md
          generate_release_notes: false
          files: |
            dist/N-Lite.exe
            dist/N-Lite-Setup-x64.exe

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/N-Lite.exe
            dist/N-Lite-Setup-x64.exe
